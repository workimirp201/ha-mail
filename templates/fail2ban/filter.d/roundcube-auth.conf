# ha-mail :: /etc/fail2ban/filter.d/roundcube-auth.conf
#
# Roundcube authentication failures, in the two shapes it writes them
# (both present with $config['log_logins'] = true, set in config.inc.php):
#
#   [09-Sep-2026 22:35:02 +0000]: <sess> IMAP Error: Login failed for
#       alice@example.com against 127.0.0.1 from 203.0.113.55. AUTHENTICATE ...
#   [09-Sep-2026 22:35:09 +0000]: <sess> Failed login for bob@example.com
#       from 203.0.113.55 in session abc124 (error: 0)
#
# TWO THINGS THAT SILENTLY DISABLE THIS FILTER IF YOU GET THEM WRONG:
#
# 1. EXACTLY ONE <HOST> PER failregex LINE. fail2ban expands <HOST> into a
#    NAMED capture group; two in one expression is a duplicate group name and
#    Python refuses to compile it. fail2ban logs that once at startup and then
#    the jail protects nothing. (`fail2ban-regex` reports it immediately --
#    always test a filter that way before trusting it.)
#
# 2. `^\[\]:` IS CORRECT, NOT A TYPO. fail2ban removes the text matched by
#    `datepattern` from the line before applying failregex, so with the
#    brackets kept OUT of the datepattern the prefix collapses to `[]:`.
#
# proxy_whitelist in config.inc.php ensures the address here is the real client
# rather than 127.0.0.1. If every ban targets 127.0.0.1, check that setting.

[Definition]

failregex = ^\[\]:\s+(?:<\S+>\s+)?IMAP Error: Login failed for \S+ (?:against \S+ )?from <HOST>
            ^\[\]:\s+(?:<\S+>\s+)?Failed login for \S+ from <HOST>
            ^\[\]:\s+(?:<\S+>\s+)?Error: Login failed for \S+ from <HOST>

ignoreregex = ^\[\]:\s+(?:<\S+>\s+)?Successful login for \S+ from <HOST>

datepattern = %%d-%%b-%%Y %%H:%%M:%%S %%z
