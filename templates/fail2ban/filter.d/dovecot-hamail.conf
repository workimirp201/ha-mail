# ha-mail :: /etc/fail2ban/filter.d/dovecot-hamail.conf
#
# Supplements the packaged dovecot filter with the failure modes that matter
# specifically on a REPLICATED pair:
#
#   * doveadm authentication failures  - a wrong DOVEADM_PASS on one node
#     shows up here rather than as silently stalled replication
#   * managesieve auth failures        - port 4190 is often forgotten
#   * "Aborted login" from clients that connect and immediately disconnect,
#     which is the signature of an IMAP scanner
#
# NOTE: the doveadm entries will normally match only the PEER's tunnel
# address, which is in ignoreip. They exist so the ban LOG tells you the
# secret is wrong - not so the peer gets banned.

[INCLUDES]
before = common.conf

[Definition]

_daemon = (auth|dovecot(-auth)?|imap-login|managesieve-login|doveadm)

failregex = ^%(__prefix_line)s(?:auth|imap-login|managesieve-login): (?:Info|Warning): .*(?:authentication failure|Aborted login|Disconnected \(auth failed).*rip=<HOST>
            ^%(__prefix_line)sdoveadm: Error: .*[Aa]uthentication failed.* rip=<HOST>
            ^%(__prefix_line)sdoveadm.*: Error: doveadm client:.*: Authentication failed.*<HOST>
            ^%(__prefix_line)s(?:auth|imap-login): Info: Login aborted.*rip=<HOST>

ignoreregex =

journalmatch = _SYSTEMD_UNIT=dovecot.service
