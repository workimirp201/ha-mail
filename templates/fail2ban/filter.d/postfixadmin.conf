# ha-mail :: /etc/fail2ban/filter.d/postfixadmin.conf
#
# PostfixAdmin has no failed-login log of its own that parses reliably across
# versions, so this watches the nginx access log instead.
#
# The signal: PostfixAdmin re-renders the login page with an error message on
# FAILURE (HTTP 200) and issues a redirect on SUCCESS (HTTP 302). So repeated
# 200 responses to a POST of /login.php are repeated failed logins, and a
# successful login cannot match.
#
# NOTE ON `\[\]` -- THIS IS NOT A TYPO.
# fail2ban locates the timestamp with `datepattern` and REMOVES that text from
# the line before applying failregex. With the brackets left out of the
# datepattern (as below), `[09/Sep/2026:22:30:01 +0000]` becomes `[]`. This is
# the same convention the shipped nginx-* filters use. Putting the brackets
# inside the datepattern strips them too, and then nothing ever matches --
# silently, because a filter that matches nothing looks identical to a filter
# that has nothing to match.

[Definition]

failregex = ^<HOST> - \S+ \[\] "POST /login\.php[^"]*" 200 
            ^<HOST> - \S+ \[\] "POST /users/password-recover\.php[^"]*" 200 

ignoreregex = ^<HOST> - \S+ \[\] "POST /login\.php[^"]*" 30[0-9] 

datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
